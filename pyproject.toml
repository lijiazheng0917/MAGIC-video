[build-system]
requires = ["uv_build>=0.9.18,<0.10.0"]
build-backend = "uv_build"

[project]
name = "worldmm"
version = "0.1.1"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch==2.7.1",
    "torchcodec==0.3",
    "torchvision==0.22.1",
    "huggingface_hub",
    "transformers>=4.57.1",
    "sentence-transformers",
    "accelerate",
    "peft",
    "openai",
    "tenacity",
    "decord",
    "faster-whisper",
    "pysrt",
    "qwen-vl-utils",
    "scikit-learn",
    "opencv-python",
    "igraph",
    "wheel",
    "faiss-gpu-cu12",
    "numpy",
    "tqdm",
    "pydantic",
    "psutil",
    "rank-bm25",
    "imageio-ffmpeg",
    "filelock",
    "hipporag",
    "egorag"
]

[project.optional-dependencies]
# Optional GPU acceleration. Install with: `uv sync --extra gpu`
# flash-attn requires a CUDA toolchain and matching torch; build is gated by
# `no-build-isolation-package` below.
gpu = [
    "flash-attn==2.8.0.post2",
]

[[tool.uv.index]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cu128"

[tool.uv.sources]
hipporag = { path = "src/HippoRAG", editable = true }
egorag = { path = "src/EgoRAG", editable = true }
torch = { index = "pytorch" }
torchcodec = { index = "pytorch" }
torchvision = { index = "pytorch" }

[tool.uv]
no-build-isolation-package = ['flash-attn']

[tool.uv.extra-build-dependencies]
flash-attn = ["torch"]

